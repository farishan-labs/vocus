schema: spec-driven

context: |
  Project: vocus — tiny, fast, minimal, extensible native HTML viewer (Faris Han Labs).
  Tech: Python 3.10+, GTK3 + WebKit2GTK 4.0/4.1; no Markdown/Mermaid logic (dumb frame).
  Constraints: fullscreen borderless, Esc close, auto light/dark, stdin/--html/--title.
  Platform: Ubuntu 22.04+ (X11). Packaging: pip editable, console script `vocus`.
  Consumed by mdview and future flowview via piping rendered HTML.

